name: Build TeX PDFs

on:
  push:
    branches: [master]
    tags: ["20*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key: build-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: build-${{ runner.os }}-
          # collect garbage until Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: build-${{ runner.os }}-
          # created more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-created: 0
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - name: Build PDFs via nix devshell
        run: |
          mkdir -p build
          shopt -s nullglob
          tex_files=(src/*.tex)
          if [ ${#tex_files[@]} -eq 0 ]; then
            echo "No TeX files found in src/*.tex"
            exit 1
          fi
          echo "Building: ${tex_files[*]}"
          # .latexmkrc sets $out_dir='../build', so PDFs land in build/ by default.
          nix develop ./nix --command bash -c 'for f in src/*.tex; do echo "=== latexmk $f ==="; latexmk "$f" || exit 1; done'
          echo "=== build/ ==="
          ls -lh build/
          ls build/*.pdf

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: build/*.pdf
          if-no-files-found: error

      - name: Upload PDFs to GitHub Release
        # date-tag push (YYYY-MM-DD*) or a published Release (including manual `gh release create`)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.pdf
          fail_on_unmatched_files: true
